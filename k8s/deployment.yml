kind: Deployment
apiVersion: apps/v1
metadata:
  name: todo-app-deployment
  labels:
    app: todo-app
  namespace: todo-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app


    spec:
      containers:
        - name: todo-app
          image: pratik140404/devops-todo-app
          ports:
            - containerPort: 80
