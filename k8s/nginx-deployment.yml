kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  namespace: todo-app
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: nginx

  template:
    metadata: 
      name: nginx-dep-pod
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
          - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

