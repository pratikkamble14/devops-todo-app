kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: nginx-todo-ingress
  namespace: todo-app
  
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - pathType: Prefix
            path: /nginx
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
          - pathType: Prefix
            path: /
            backend:
              service:
                name: todo-app-service
                port:
                  number: 5000
