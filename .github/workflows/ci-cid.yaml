name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          pratik140404/devops-todo-app:latest
          pratik140404/devops-todo-app:${{ github.sha }}

    - name: Test Docker container
      run: |
        docker run -d -p 8081:5000 --name todo-app-container pratik140404/devops-todo-app:latest
        sleep 5
        curl http://localhost:8081/
        docker stop todo-app-container
        docker rm todo-app-container

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
  docker pull pratik140404/devops-todo-app:latest
  docker stop todo-app || true
  docker rm todo-app || true
  mkdir -p /home/ubuntu/todo-data
  docker run -d -p 5000:5000 --name todo-app --restart always \
    -v /home/ubuntu/todo-data:/app/instance \
    pratik140404/devops-todo-app:latest
  echo "✅ Deployed with SQLite persistence!"
