name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest tests/ -v

  # JOB 2: Build & test Docker image
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        docker build -t todo-app:${{ github.sha }} .

    - name: Test Docker container
      run: |
        docker run -d -p 8081:5000 --name todo-app-container todo-app:${{ github.sha }}
        sleep 5
        curl http://localhost:8081/
        docker stop todo-app-container

    - name: Clean up Docker container
      run: |
        docker rm todo-app-container

  # JOB 3: Deploy to EC2
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to main, not on pull requests
    if: github.event_name == 'push'
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd devops-todo-app
          git pull origin main
          docker build -t devops-todo-app .
          docker stop todo-app || true
          docker rm todo-app || true
          docker run -d -p 5000:5000 --name todo-app --restart always devops-todo-app
          echo "Deployed successfully!"
